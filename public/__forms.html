<!DOCTYPE html>
<html>
  <body>
    <form
      name="automation-review"
      method="POST"
      action="/thank-you"
      data-netlify="true"
      netlify
    >
      <input type="hidden" name="form-name" value="automation-review" />

      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="problem"></textarea>
      <select name="time">
        <option value="">Select an option</option>
        <option value="less-than-1-hour">Less than 1 hour per week</option>
        <option value="1-3-hours">1–3 hours per week</option>
        <option value="3-5-hours">3–5 hours per week</option>
        <option value="5-plus-hours">5+ hours per week</option>
        <option value="not-sure">Not sure</option>
      </select>
    </form>
  </body>
</html>
